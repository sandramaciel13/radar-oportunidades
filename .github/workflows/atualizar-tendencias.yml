
name: Atualizar tendências do Google Trends

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Coletar tendências
        run: python scripts/coletar_tendencias.py

      - name: Salvar tendências no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza tendências do Google Trends"
            git push
          else
            echo "Nenhuma alteração nas tendências."
          fi
